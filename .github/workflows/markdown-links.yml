name: Markdown links

on:
  push:
    branches: [main, master]
    paths: ["**.md", ".github/scripts/check_markdown_links.py"]
  pull_request:
    paths: ["**.md", ".github/scripts/check_markdown_links.py"]
  schedule:
    # weekly: catch external link rot even without doc changes
    - cron: "0 7 * * 1"

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check markdown links
        run: python3 .github/scripts/check_markdown_links.py --root .
